server {
    listen 80;

    # SPEC.mdのIngress相当のパスルーティング(/ → frontend, /api/* → bff)をローカル開発で再現する
    location /api/ {
        proxy_pass http://bff:3000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
