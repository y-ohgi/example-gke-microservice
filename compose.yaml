services:
  catalog-service:
    build: ./apps/catalog-service
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/products"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  order-service:
    build: ./apps/order-service
    environment:
      CATALOG_SERVICE_BASE_URL: http://catalog-service:8080
    ports:
      - "8081:8081"
    depends_on:
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/orders"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  bff:
    build: ./apps/bff
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8080
      ORDER_SERVICE_URL: http://order-service:8081
    ports:
      - "3000:3000"
    depends_on:
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/products', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build: ./apps/frontend
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5

  # SPEC.mdのIngress相当のパスルーティングをローカルで再現する入口。
  # ブラウザからは http://localhost:8000 でアクセスする。
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      frontend:
        condition: service_healthy
      bff:
        condition: service_healthy
