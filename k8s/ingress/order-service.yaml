apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ec-app
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: asia-northeast1-docker.pkg.dev/PROJECT_ID/example-gke-microservice/order-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: CATALOG_SERVICE_BASE_URL
              value: http://catalog-service:8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ec-app
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
