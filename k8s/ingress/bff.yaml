apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: ec-app
  labels:
    app: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      containers:
        - name: bff
          image: asia-northeast1-docker.pkg.dev/PROJECT_ID/example-gke-microservice/bff:latest
          ports:
            - containerPort: 3000
          env:
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:8080
            - name: ORDER_SERVICE_URL
              value: http://order-service:8081
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: ec-app
spec:
  selector:
    app: bff
  ports:
    - port: 3000
      targetPort: 3000
