apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: ec-app
  labels:
    app: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          # PROJECT_ID, REGION, REPOSITORY は docs/gcp-setup.md の手順で決めた値に置き換える
          image: asia-northeast1-docker.pkg.dev/PROJECT_ID/example-gke-microservice/catalog-service:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: ec-app
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8080
      targetPort: 8080
