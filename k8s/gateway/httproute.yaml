apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ec-app-route
  namespace: ec-app
spec:
  parentRefs:
    - name: ec-app-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: bff
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
